<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Demo navegable del Módulo 0 del sistema de trazabilidad de ASLAN PLASTIK S.A.S. Datos de ejemplo."><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Demo M0 Aslan Plastik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Poppins:wght@400;500;600&family=Lato:wght@400;700&display=swap">
<style>
/* Layout: barra lateral azul marino institucional fija + área de trabajo clara en gris técnico.
   Ingreso en dos paneles: marca (azul marino con el degradado principal) y formulario. */
:root{
  --navy:#0A1A2F; --orange:#FF6A00; --steel:#7C868E; --graphite:#1C1F23;
  --bg:#F1F3F5; --surface:#FFFFFF; --surface-2:#F7F8FA; --line:#D9DDE1; --line-2:#B8BEC4;
  --ink:#1C1F23; --ink-2:#4A535B; --ink-3:#69727A;
  --accent:#FF6A00; --accent-ink:#B04600; --accent-soft:#FFF1E6; --on-accent:#0A1A2F;
  --ok:#1B6E46; --ok-soft:#E3F3EA; --warn:#8A5A00; --warn-soft:#FFF3D6;
  --bad:#B3261E; --bad-soft:#FBE7E5; --info:#1F4F8A; --info-soft:#E7EEF8;
  --side-bg:#0A1A2F; --side-ink:#E3E9EF; --side-ink-2:#8EA0B4; --side-line:rgba(255,255,255,.08);
  --side-hover:rgba(255,255,255,.06); --side-active:rgba(255,106,0,.16);
  --scrim:rgba(10,26,47,.55);
  --shadow:0 1px 2px rgba(10,26,47,.06),0 10px 28px rgba(10,26,47,.10);
  --f-display:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-ui:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-text:'Lato',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --surface:#1C1F23; --surface-2:#22262B; --line:#2F353C; --line-2:#46505A;
    --ink:#ECEFF2; --ink-2:#B9C1C8; --ink-3:#919AA3;
    --accent-ink:#FF9447; --accent-soft:rgba(255,106,0,.15);
    --ok:#5CC28F; --ok-soft:rgba(92,194,143,.14); --warn:#E7B04B; --warn-soft:rgba(231,176,75,.14);
    --bad:#F2857C; --bad-soft:rgba(242,133,124,.14); --info:#8DB4E8; --info-soft:rgba(141,180,232,.14);
    --side-bg:#07121F; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --surface:#1C1F23; --surface-2:#22262B; --line:#2F353C; --line-2:#46505A;
  --ink:#ECEFF2; --ink-2:#B9C1C8; --ink-3:#919AA3;
  --accent-ink:#FF9447; --accent-soft:rgba(255,106,0,.15);
  --ok:#5CC28F; --ok-soft:rgba(92,194,143,.14); --warn:#E7B04B; --warn-soft:rgba(231,176,75,.14);
  --bad:#F2857C; --bad-soft:rgba(242,133,124,.14); --info:#8DB4E8; --info-soft:rgba(141,180,232,.14);
  --side-bg:#07121F; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent-ink)}
.num,.t td.n,.t th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Tipografía de marca: H1 Montserrat ExtraBold mayúsculas, H2 Montserrat Bold mayúsculas, H3 Poppins Semibold */
.h1{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:1.55rem;line-height:1.15;margin:0;text-wrap:balance;color:var(--ink)}
.h2{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.82rem;margin:0;color:var(--ink)}
.h3{font-family:var(--f-ui);font-weight:600;font-size:1rem;margin:0}
.lead{color:var(--ink-2);margin:.35rem 0 0;max-width:68ch}
.eyebrow{font-family:var(--f-ui);font-weight:600;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin:0}
.muted{color:var(--ink-3)}
.fine{font-size:.8rem;color:var(--ink-3)}
p{margin:0}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:6px;padding:.5rem .9rem;font-weight:500;font-size:.88rem;cursor:pointer;white-space:nowrap;min-height:36px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.sm{padding:.25rem .55rem;min-height:30px;font-size:.8rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.link{background:none;border:0;padding:0;color:var(--accent-ink);cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:6px;border:1px solid transparent;background:transparent;cursor:pointer;color:inherit}
.icon-btn:hover{background:var(--surface-2)}

/* Campos */
.field{display:grid;gap:.3rem;min-width:0}
.field>span{font-size:.8rem;font-weight:500;color:var(--ink-2)}
.field>span i{font-style:normal;color:var(--ink-3);font-weight:400}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:.5rem .65rem;min-height:38px;font-family:var(--f-text);font-size:.95rem}
textarea.input{min-height:76px;resize:vertical}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.input[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:.8rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem}
.span2{grid-column:1/-1}
.pw{position:relative}
.pw .input{padding-right:2.6rem}
.pw .icon-btn{position:absolute;right:2px;top:1px}
.check{display:flex;gap:.65rem;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:.15rem;accent-color:var(--accent);flex:none}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem .9rem}
.checks label{display:flex;gap:.5rem;align-items:center;font-size:.88rem}
.checks input{accent-color:var(--accent);width:16px;height:16px}

/* Mensajes */
.msg{border-radius:6px;padding:.6rem .8rem;font-size:.88rem;display:flex;gap:.5rem;align-items:flex-start}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.info{background:var(--info-soft);color:var(--info)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
mark.pend{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 .25em;font-weight:600}

/* Píldoras y chips */
.pill{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.08rem .55rem;font-size:.74rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.pill svg{width:12px;height:12px}
.hu{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:.02rem .35rem;background:var(--surface)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid var(--line-2);vertical-align:-1px}

/* Tarjetas, tablas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.85rem 1rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:1rem}
.stack{display:grid;gap:1rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.card .tbl-wrap{border:0;border-radius:0}
table.t{width:100%;border-collapse:collapse;font-family:var(--f-text);font-size:.9rem}
.t th{text-align:left;font-family:var(--f-ui);font-weight:600;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:.6rem .75rem;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.t td{padding:.6rem .75rem;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t td.n,.t th.n{text-align:right;white-space:nowrap}
.t tr.void td{color:var(--ink-3)}
.t tr.void td .strike{text-decoration:line-through}
.t .acts{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.t .acts.nw{flex-wrap:nowrap}
.t td.num{white-space:nowrap}
.t td.mono,.t td.nw{white-space:nowrap}
.t td.acts-cell{text-align:right}
.sub{display:block;font-size:.8rem;color:var(--ink-3)}
.empty{padding:1.5rem;text-align:center;color:var(--ink-3)}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}
.toolbar .field{min-width:160px;flex:1 1 160px;max-width:260px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem}
.kpi{display:grid;gap:.25rem;padding:.9rem 1rem;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.kpi:hover{border-color:var(--line-2)}
.kpi b{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.82rem;color:var(--ink-2)}
.kpi.alert b{color:var(--accent-ink)}

/* ---------- Ingreso ---------- */
.login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);min-height:100vh}
.login-brand{position:relative;background:radial-gradient(120% 80% at 30% 20%,#12294A 0%,#0A1A2F 55%,#07121F 100%);color:#E3E9EF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding-block:3rem 4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;overflow:hidden}
.login-brand img{width:min(300px,62%);height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.login-brand .kicker{font-family:var(--f-display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem;color:#C7D2DD;text-align:center}
.login-brand .tag{font-family:var(--f-ui);font-size:.92rem;color:#8EA0B4;text-align:center}
.login-band{position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#0A1A2F 0%,#0A1A2F 25%,#FF6A00 100%)}
.login-main{display:flex;flex-direction:column;justify-content:center;gap:1.2rem;padding-block:2.5rem;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
.login-card{width:100%;max-width:440px;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.8rem;box-shadow:var(--shadow)}
.login-card.wide{max-width:620px}
.login-card form{display:grid;gap:1rem}
.login-foot{width:100%;max-width:620px;margin-inline:auto;display:flex;gap:.5rem 1rem;flex-wrap:wrap;justify-content:center;font-size:.8rem;color:var(--ink-3)}
.demo-users{width:100%;max-width:620px;margin-inline:auto}
.demo-users summary{cursor:pointer;font-weight:600;font-size:.82rem;color:var(--ink-2);padding:.4rem 0}
.demo-users .t td,.demo-users .t th{padding:.45rem .6rem}
.demo-users tr[data-act]{cursor:pointer}
.demo-users tr[data-act]:hover td{background:var(--accent-soft)}
.docbtns{display:grid;gap:.5rem}
.docbtn{display:flex;align-items:center;gap:.6rem;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:.6rem .75rem;cursor:pointer;color:var(--ink)}
.docbtn:hover{border-color:var(--accent)}
.docbtn svg{color:var(--accent-ink)}
.accept-text{font-family:var(--f-text);font-size:.98rem;line-height:1.6;color:var(--ink)}
.accept-box{border:1px solid var(--line-2);border-radius:8px;padding:.9rem;background:var(--surface-2)}
.rules{list-style:none;padding:0;margin:0;display:grid;gap:.3rem;font-size:.85rem}
.rules li{display:flex;gap:.45rem;align-items:center;color:var(--ink-3)}
.rules li.on{color:var(--ok)}
.rules li::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.75}

/* ---------- Aplicación ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--side-bg) 0 252px,var(--bg) 252px)}
.side{background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;padding-left:env(safe-area-inset-left,0px)}
.side-brand{display:flex;align-items:center;gap:.6rem;padding:.9rem 1rem .75rem;border-bottom:1px solid var(--side-line)}
.side-brand .iso{width:42px;height:auto}
.side-brand .word{width:132px;height:auto}
.nav{padding:.6rem .55rem 1rem;display:grid;gap:.15rem}
.nav-sec{font-family:var(--f-ui);font-weight:600;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--side-ink-2);padding:.75rem .6rem .25rem}
.nav a{display:flex;align-items:center;gap:.6rem;padding:.36rem .6rem;border-radius:6px;color:var(--side-ink);text-decoration:none;font-size:.88rem}
.nav a:hover{background:var(--side-hover)}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff}
.nav a[aria-current="page"] svg{color:var(--orange)}
.nav a .m{margin-left:auto;font-family:var(--f-mono);font-size:.66rem;color:var(--side-ink-2)}
.nav a .cnt{margin-left:auto;background:var(--orange);color:var(--navy);border-radius:999px;font-size:.68rem;font-weight:700;padding:0 .4rem;min-width:1.2rem;text-align:center}
.side-foot{margin-top:auto;padding:.9rem 1rem 1.1rem;border-top:1px solid var(--side-line);font-size:.72rem;color:var(--side-ink-2);display:grid;gap:.2rem}
.main-wrap{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.55rem 1.5rem;padding-right:max(1.5rem,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-ctx{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;min-width:0;flex:1}
.ctx{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:.15rem .6rem;white-space:nowrap}
.ctx b{color:var(--ink);font-weight:600}
.ctx svg{width:14px;height:14px}
.top-user{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.who{display:grid;line-height:1.2;text-align:right}
.who b{font-size:.86rem}
.who small{font-size:.72rem;color:var(--ink-3)}
.inact{font-size:.72rem;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.inact.soon{color:var(--bad);font-weight:600}
.main{padding-block:1.5rem 3rem;padding-left:1.5rem;padding-right:max(1.5rem,env(safe-area-inset-right,0px));display:grid;gap:1.25rem;align-content:start;max-width:1280px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.ph-t{display:grid;gap:.35rem;min-width:0}
.hus{display:flex;gap:.3rem;flex-wrap:wrap}
.only-m{display:none}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:.55rem .8rem;border-bottom:2px solid transparent;color:var(--ink-2);cursor:pointer;font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .c{font-size:.72rem;color:var(--ink-3);margin-left:.25rem}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.35rem 1rem;font-size:.9rem}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.shift{display:grid;gap:.2rem;padding:.85rem 1rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.shift b{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.8rem}
.mod{display:grid;gap:.35rem;padding:1rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.mod:hover{border-color:var(--accent)}
.mod svg{color:var(--accent-ink)}
.mod small{color:var(--ink-3)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.1rem .7rem;padding:.6rem 1rem;border-bottom:1px solid var(--line);font-size:.86rem}
.feed li:last-child{border-bottom:0}
.feed time{font-size:.75rem;color:var(--ink-3);font-variant-numeric:tabular-nums;grid-row:span 2}
.feed .who2{color:var(--ink-3);font-size:.78rem}
.matrix td.c,.matrix th.c{text-align:center;padding:.4rem .3rem}
.matrix th.c{white-space:normal;min-width:84px;line-height:1.25}
.perm{width:44px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--ink-3)}
.perm.si{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.perm.pd{border-style:dashed;color:var(--warn);background:var(--warn-soft)}
.perm:disabled{cursor:not-allowed;opacity:.75}
.grp td{background:var(--surface-2);font-family:var(--f-ui);font-weight:600;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);align-items:center}
.result{border:1px dashed var(--line-2);border-radius:8px;padding:.9rem 1rem;background:var(--surface-2);display:grid;gap:.3rem}
.result b{font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.preview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem;align-items:end}
.neto{font-family:var(--f-display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.doc{font-family:var(--f-text);font-size:.95rem;line-height:1.65;display:grid;gap:.7rem;max-width:72ch}
.doc h3{font-family:var(--f-display);font-weight:700;font-size:.95rem;margin:.6rem 0 0}
.doc table{border-collapse:collapse;font-size:.85rem;width:100%}
.doc td,.doc th{border:1px solid var(--line);padding:.4rem .5rem;vertical-align:top;text-align:left}
.doc tr:first-child td{background:var(--surface-2);font-weight:700}
.toggle{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--line-2);border-radius:999px;padding:.25rem .7rem .25rem .3rem;background:var(--surface);cursor:pointer;font-size:.84rem}
.toggle i{width:30px;height:18px;border-radius:999px;background:var(--line-2);position:relative;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-pressed="true"] i{background:var(--accent)}
.toggle[aria-pressed="true"] i::after{transform:translateX(12px)}
ol.steps{margin:0;padding-left:1.2rem;display:grid;gap:.45rem}

/* Modal y avisos */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;padding:1.1rem 1.2rem .8rem;border-bottom:1px solid var(--line)}
.modal-b{padding:1.1rem 1.2rem;overflow-y:auto;display:grid;gap:1rem}
.modal-f{display:flex;justify-content:flex-end;gap:.5rem;padding:.85rem 1.2rem;border-top:1px solid var(--line);flex-wrap:wrap}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:.5rem;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--navy);color:#fff;border-radius:8px;padding:.65rem .9rem;font-size:.86rem;box-shadow:var(--shadow);border-left:4px solid var(--orange)}
.toast.bad{border-left-color:#F2857C}
.toast.warn{border-left-color:#E7B04B}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1fr)}.preview{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr);background:var(--bg)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:40;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .side[data-open="true"]{transform:none}
  .side-scrim{position:fixed;inset:0;background:var(--scrim);z-index:35}
  .only-m{display:inline-grid}
  .top{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .who{display:none}
}
@media (max-width:860px){
  .login{grid-template-columns:minmax(0,1fr);min-height:0}
  .login-brand{padding-block:1.5rem 2rem;padding-right:max(16px,env(safe-area-inset-right,0px));flex-direction:row;gap:1rem}
  .login-brand img{width:110px}
  .login-brand .txt{display:grid;gap:.3rem}
  .login-brand .kicker,.login-brand .tag{text-align:left}
}
@media (max-width:640px){
  .grid2,.grid3,.checks{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .login-card{padding:1.2rem}
  .h1{font-size:1.3rem}
  .top-user .btn span{display:none}
  .preview{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const TEXTOS = {"politica": [["h", "1. Responsable del tratamiento"], ["table", [["Dato", "Valor"], ["Razón social", "ASLAN PLASTIK S.A.S."], ["NIT", "[●]"], ["Domicilio", "[● ciudad]"], ["Dirección", "[●]"], ["Teléfono", "[●]"], ["Correo para asuntos de datos personales", "[● por ejemplo datospersonales@dominio]"], ["Área responsable de atender a los titulares", "[● por ejemplo Administración]"]]], ["h", "2. Objeto, marco legal y alcance"], ["p", "Esta política explica cómo ASLAN PLASTIK S.A.S. (en adelante, ASLAN) recolecta, guarda, usa, circula y suprime los datos personales que trata, para qué lo hace y cómo los titulares pueden ejercer sus derechos. Cumple la Ley 1581 de 2012 y el Decreto 1074 de 2015 (Capítulos 25 y 26 del Título 2, Parte 2, Libro 2), que compiló el Decreto 1377 de 2013."], ["p", "Aplica a todas las bases de datos con información personal que ASLAN trate como responsable, y obliga a sus trabajadores, contratistas y encargados del tratamiento."], ["h", "3. Definiciones"], ["p", "Dato personal: cualquier información que identifique o pueda identificar a una persona natural."], ["p", "Dato sensible: el que afecta la intimidad del titular o cuyo uso indebido puede generar discriminación, como los datos de salud, vida sexual o biométricos."], ["p", "Titular: la persona natural cuyos datos se tratan."], ["p", "Tratamiento: cualquier operación sobre datos personales: recolección, almacenamiento, uso, circulación o supresión."], ["p", "Responsable: quien decide sobre la base de datos y el tratamiento. En esta política, ASLAN."], ["p", "Encargado: quien trata datos por cuenta del responsable, por ejemplo el proveedor de hosting."], ["p", "Autorización: consentimiento previo, expreso e informado del titular."], ["p", "Transmisión: comunicación de datos a un encargado para que los trate por cuenta del responsable, dentro o fuera de Colombia."], ["p", "Transferencia: envío de datos a otro responsable."], ["h", "4. Principios"], ["p", "ASLAN aplica los principios de la Ley 1581 de 2012: legalidad, finalidad, libertad, veracidad o calidad, transparencia, acceso y circulación restringida, seguridad y confidencialidad. En la práctica: solo recoge los datos necesarios para una finalidad informada, los usa únicamente para esa finalidad, los protege y no los entrega a terceros sin autorización o mandato legal."], ["h", "5. Bases de datos, datos tratados y finalidades"], ["table", [["Base de datos", "Titulares", "Datos que se tratan", "Finalidades"], ["Trabajadores y usuarios del sistema de trazabilidad", "Trabajadores y contratistas de ASLAN que usan el sistema", "Nombre completo, número de cédula, correo electrónico (opcional), usuario, roles, turnos asignados, clave (guardada cifrada, nunca en claro), registro de actividad en el sistema (qué acción, en qué fecha y hora, desde qué estación), intentos de ingreso y aceptaciones de esta política y de los términos de uso", "Identificar a cada usuario y controlar su acceso; asignar el turno de trabajo; dejar constancia de quién registró, modificó o anuló cada información de producción, para la trazabilidad de los productos; auditoría y seguridad de la información; recuperación de la clave; atender requerimientos de autoridades"], ["Clientes", "Personas de contacto de los clientes; clientes que sean personas naturales", "Nombre o razón social, número de identificación, código de cliente, nombre y datos de contacto de la persona que recibe o gestiona pedidos", "Despachos, remisiones, devoluciones, facturación, servicio al cliente y trazabilidad de los productos entregados"], ["Proveedores", "Personas de contacto de los proveedores; proveedores que sean personas naturales", "Nombre o razón social, número de identificación, código de proveedor y datos de contacto", "Recepción de materia prima, trazabilidad de lotes, pagos y gestión de la relación comercial"], ["[● Otras bases de ASLAN: nómina, hojas de vida, videovigilancia, visitantes]", "[●]", "[●]", "[●]"]]], ["p", "El registro     for(const off of [-1,0,1]){
      const st = base + off*864e5 + s*6e4, w0 = st - tol, w1 = st + dur*6e4 - tol;
      if(t>=w0 && t<w1){ const d = new Date(st); return {turno:tu, fecha:`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`, cruza: e<=s, tolerancia: t<st}; }
    }
  }
  return null;
}
function solapa(rol, inicio, fin, exceptId){
  const mark = (a,b) => { const s = toMin(a), e = toMin(b), dur = e>s ? e-s : e+1440-s, set = new Set(); for(let i=0;i<dur;i++) set.add((s+i)%1440); return set; };
  const mine = mark(inicio, fin);
  for(const tu of S.turnos.filter(x => x.rol===rol && x.estado==='activo' && x.id!==exceptId)){ const o = mark(tu.inicio, tu.fin); for(const m of mine) if(o.has(m)) return tu; }
  return null;
}

const accAlDia = usuario => { const a = lastAcc(usuario); return !!a && a.politica===S.docs.politica.version && a.terminos===S.docs.terminos.version; };

function lockOf(usuario){ const out = []; for(const k in S.intentos){ const it = S.intentos[k]; if(k.startsWith(usuario+'|') && it.hasta && Date.parse(it.hasta) > Date.now()) out.push({k, est:k.split('|')[1], hasta:it.hasta}); } return out; }

function doLogin(usuario, clave){
  const un = norm(usuario); if(!un || !clave){ ui.msg = {k:'bad', t:'Escriba su usuario y su clave.'}; return render(); }
  const key = lockKey(un); const it = S.intentos[key] || {n:0, hasta:null};
  if(it.hasta && Date.parse(it.hasta) > Date.now()){
    const min = Math.ceil((Date.parse(it.hasta)-Date.now())/6e4);
    ui.msg = {k:'bad', t:`Este usuario está bloqueado en esta estación por intentos fallidos. Intente de nuevo en ${min} min o pida al Administrador que lo desbloquee.`};
    bit('Ingreso rechazado: usuario bloqueado','Seguridad','Usuario '+un, un); save(); return render();
  }
  if(it.hasta){ it.n = 0; it.hasta = null; }
  const u = userBy(un);
  if(!u || u.hash !== pwHash(u.usuario, clave)){
    it.n++;
    if(it.n >= S.params.intentos){
      it.hasta = new Date(Date.now()+S.params.bloqueoMin*6e4).toISOString();
      ui.msg = {k:'bad', t:`Usuario o clave incorrectos. Después de ${S.params.intentos} intentos fallidos el usuario queda bloqueado ${S.params.bloqueoMin} minutos en esta estación. El Administrador puede desbloquearlo.`};
      bit('Bloqueo por intentos fallidos','Seguridad',`${it.n} intentos fallidos · bloqueado ${S.params.bloqueoMin} min`, un);
    } else {
      ui.msg = {k:'bad', t:`Usuario o clave incorrectos (intento ${it.n} de ${S.params.intentos}).`};
      bit('Intento fallido de ingreso','Seguridad',`Intento ${it.n} de ${S.params.intentos}`, un);
    }
    S.intentos[key] = it; save(); render();
    const c = $('#lg-clave'); if(c){ c.value=''; c.focus(); }
    return;
  }
  delete S.intentos[key];
  if(u.estado !== 'activo'){ ui.msg = {k:'bad', t:'Este usuario está inactivo. Consulte al Administrador del sistema.'}; bit('Ingreso rechazado: usuario inactivo','Seguridad','', u.usuario); save(); return render(); }
  ui.msg = null; ui.chk = false; ui.pending = {userId:u.id}; save(); nextStep();
}

/* ---------- exportar a Excel ---------- */
let XLSXp = null, dlP = null;
function loadXLSX(){ if(window.XLSX) return Promise.resolve(window.XLSX); if(!XLSXp) XLSXp = new Promise((res,rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => res(window.XLSX); s.onerror = () => { XLSXp = null; rej(new Error('No se pudo cargar el generador de Excel.')); }; document.head.appendChild(s); }); return XLSXp; }
function getDl(){ if(!dlP) dlP = (window.claude && typeof window.claude.use === 'function') ? Promise.resolve(window.claude.use('downloads')).catch(() => null) : Promise.resolve(null); return dlP; }
async function exportar(nombre, hoja, filas, modulo){
  const enClaude = !!(window.claude && typeof window.claude.use === 'function');
  const dl = await getDl();
  if(!dl && enClaude){ toast('La descarga a Excel no está disponible en esta vista.', 'warn'); return; }
  try{
    const X = await loadXLSX();
    const ws = X.utils.json_to_sheet(filas.length ? filas : [{Resultado:'Sin registros'}]);
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, hoja.slice(0,31));
    const buf = X.write(wb, {bookType:'xlsx', type:'array'});
    if(dl) await dl.save({filename:nombre, data:buf});
    else {
      // Fuera de Claude (GitHub Pages o archivo local): descarga normal del navegador
      const url = URL.createObjectURL(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
      const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
    bit('Exportación a Excel', modulo, `${nombre} · ${filas.length} filas`); save(); toast('Archivo listo: '+nombre);
  }catch(e){ if(e && e.code==='declined') return; toast('No se pudo exportar. '+((e&&e.message)||''), 'bad'); }
}

/* Usuarios (HU-M0-002, 003, 034) */
function proponerUsuario(nombre, ap1, ap2, exceptId){
  const n = norm(nombre).replace(/[^a-z ]/g,''), a1 = norm(ap1).replace(/[^a-z]/g,''), a2 = norm(ap2).replace(/[^a-z]/g,'');
  if(!n || !a1) return '';
  const taken = x => S.usuarios.some(u => u.usuario===x && u.id!==exceptId);
  let base = n[0] + a1; if(!taken(base)) return base;
  if(a2){ const b2 = base + a2[0]; if(!taken(b2)) return b2; base = b2; }
  let i = 2; while(taken(base+i)) i++; return base+i;
}

function simRes(rol, ymd, hm){
  if(!ymd || !hm) return '<span class="muted">Elija fecha y hora.</span>';
  const r = turnoDe(rol, fromLocal(ymd, hm));
  if(!r) return `<span class="eyebrow">${esc(rolNom(rol))} · ${fmtYmd(ymd)} ${esc(hm)}</span><b>Fuera de turno</b><span class="muted">No hay un turno activo de este rol a esa hora.</span>`;
  const notas = [];
  if(r.tolerancia) notas.push(`Entra dentro de los ${S.params.toleranciaMin} min de tolerancia antes de las ${r.turno.inicio}.`);
  if(r.cruza) notas.push('El turno cruza la medianoche: pertenece a la fecha en que empieza.');
  return `<span class="eyebrow">${esc(rolNom(rol))} · ${fmtYmd(ymd)} ${esc(hm)}</span><b>${esc(turnoTxt(r.turno))}</b><span>Fecha del turno: <b style="font-size:1rem">${fmtYmd(r.fecha)}</b></span>${notas.map(n => `<span class="muted">${n}</span>`).join('')}`;
}

function usoMaestro(mk, id){
  const r = S.registros, p = S.maestros.productos;
  if(mk==='calibres') return r.filter(x => x.calibreId===id).length + p.filter(x => x.calibreId===id).length;
  if(mk==='maquinas') return r.filter(x => x.maquinaId===id).length;
  if(mk==='clientes') return r.filter(x => x.clienteId===id).length + p.filter(x => x.clienteId===id).length;
  if(mk==='proveedores') return r.filter(x => x.proveedorId===id).length;
  if(mk==='colores') return r.filter(x => x.colorId===id).length;
  if(mk==='tiposMaterial') return r.filter(x => x.materialId===id).length;

  if(mk==='colores') return `<td><span class="dot" style="background:${COLOR_HEX[v]||'transparent'}"></span> ${esc(v)}</td>`;
  return `<td>${c.k==='codigo'||c.k==='referencia'?`<span class="mono">${esc(v)}</span>`:esc(v)}</td>`;
}

function corrCampos(r){
  const ops = (mk, f) => S.maestros[mk].filter(y => y.estado==='activo' && (!f || f(y))).map(y => [y.id, mlabel(mk,y.id)]);
  if(r.tipo==='perfilado') return [{k:'brutoC',l:'Peso bruto (kg)',actual:kg(r.brutoC)+' kg',ph:'18,40'},{k:'calibreId',l:'Calibre',actual:mlabel('calibres',r.calibreId),ops:ops('calibres')},{k:'maquinaId',l:'Máquina',actual:mlabel('maquinas',r.maquinaId),ops:ops('maquinas',y => y.tipo==='Perfiladora')}];
  if(r.tipo==='recepcion') return [{k:'kgC',l:'Peso (kg)',actual:kg(r.kgC)+' kg',ph:'620,00'},{k:'proveedorId',l:'Proveedor',actual:mlabel('proveedores',r.proveedorId),ops:ops('proveedores')},{k:'colorId',l:'Color',actual:mlabel('colores',r.colorId),ops:ops('colores')}];
  if(r.tipo==='extrusion') return [{k:'kgC',l:'Consumo (kg)',actual:kg(r.kgC)+' kg',ph:'300,00'},{k:'maquinaId',l:'Máquina',actual:mlabel('maquinas',r.maquinaId),ops:ops('maquinas',y => y.tipo==='Extrusora')},{k:'colorId',l:'Color',actual:mlabel('colores',r.colorId),ops:ops('colores')}];
  return [{k:'clienteId',l:'Cliente',actual:mlabel('clientes',r.clienteId),ops:ops('clientes')}];
}

/* ---------- render ---------- */
const app = document.getElementById('app');
function render(){
  const a = document.activeElement, id = a && a.id; let s1 = null, s2 = null;
  try { s1 = a.selectionStart; s2 = a.selectionEnd; } catch(e){}
  const mainEl = $('#main'), sc = mainEl ? window.scrollY : 0;
  const prevRoute = render.route;
  app.innerHTML = (S.session ? vShell() : vLogin()) + vModal();
  render.route = S.session ? ui.route : null;
  if(prevRoute === render.route) window.scrollTo(0, sc); else window.scrollTo(0, 0);
  if(id){ const n = document.getElementById(id); if(n && n.tagName !== 'BUTTON'){ n.focus({preventScroll:true}); try { if(s1 != null) n.setSelectionRange(s1, s2); } catch(e){} } }
  afterRender();
}
function afterRender(){
  tick();
  const pv = $('#pv-bruto'); if(pv) calcNeto();
  if(ui.modal && !document.activeElement.closest('.modal')){ const f = document.querySelector('.modal input:not([type=checkbox]),.modal select,.modal textarea'); if(f && !ui.modal.noFocus) f.focus({preventScroll:true}); }
}
function calcNeto(){ const b = parseKg($('#pv-bruto').value), cal = mref('calibres', $('#pv-cal').value); const out = $('#pv-neto'); if(!out) return; out.textContent = (b==null || !cal) ? '—' : (b - cal.tuboC <= 0 ? 'Revise el peso' : kg(b - cal.tuboC)+' kg'); }
function pwRules(){
  const u = S.usuarios.find(x => x.id===ui.pending.userId), p1 = ($('#pw-1')||{}).value||'', p2 = ($('#pw-2')||{}).value||'';
  const ok = {len:p1.length>=8, ced:p1 && p1!==u.cedula, usr:p1 && norm(p1)!==u.usuario, eq:p1 && p1===p2};
  document.querySelectorAll('#pw-rules li').forEach(li => li.classList.toggle('on', !!ok[li.dataset.r]));
  return ok;
}

/* ---------- reloj e inactividad ---------- */
function tick(){
  const t = fmtTs(nowIso()); document.querySelectorAll('.clk').forEach(e => { if(e.textContent !== t) e.textContent = t; });
  if(!S.session) return;
  const rest = S.params.inactividadMin*6e4 - (Date.now() - S.session.ult);
  if(rest <= 0) return endSession('Cierre por inactividad', `${S.params.inactividadMin} min sin actividad`, {k:'info', t:`Su sesión se cerró tras ${S.params.inactividadMin} minutos sin actividad. Ingrese de nuevo.`});
  const el = $('#inact'); if(el){ const s = Math.ceil(rest/1000); el.textContent = `Se cierra en ${Math.floor(s/60)}:${pad(s%60)}`; el.classList.toggle('soon', s <= 60); }
}
setInterval(tick, 1000);
let lastSave = 0;
function activity(){ if(!S.session) return; S.session.ult = Date.now(); if(Date.now() - lastSave > 10000){ lastSave = Date.now(); save(); } }
['pointerdown','keydown'].forEach(ev => document.addEventListener(ev, activity, {passive:true}));

  tabA: d => { ui.tabA = d.t; render(); },

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  if(el.tagName === 'A') e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && ui.modal){ closeModal(); return; }
  if(e.key === 'Enter' && e.target.matches('tr[data-act]')){ ACT[e.target.dataset.act](e.target.dataset, e.target, e); }
});
document.addEventListener('submit', e => {
  const f = e.target; if(!f.dataset.form) return; e.preventDefault();
  const fn = FORMS[f.dataset.form]; if(fn) fn(new FormData(f), f);
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.f){
    ui.f[el.dataset.f] = el.value;
    if(el.id && el.id.startsWith('sim-')){ const r = $('#sim-res'); if(r) r.innerHTML = simRes(ui.f.sr||$('#sim-rol').value, ui.f.sd||$('#sim-fecha').value, ui.f.sh||$('#sim-hora').value); return; }
    if(el.tagName === 'INPUT') return render();
  }
  if(el.id === 'pv-bruto') calcNeto();
  if(el.id === 'pw-1' || el.id === 'pw-2') pwRules();
  if(['nu-n','nu-a1','nu-a2'].includes(el.id)){ const u = $('#nu-u'); if(u && !u.dataset.touched) u.value = proponerUsuario($('#nu-n').value, $('#nu-a1').value, $('#nu-a2').value); }
  if(el.id === 'nu-u') el.dataset.touched = el.value ? '1' : '';
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'chkAcepto'){ ui.chk = el.checked; const b = $('#btnContinuar'); if(b) b.disabled = !el.checked; return; }
  if(el.id === 'pv-cal') return calcNeto();
  if(el.dataset.f && el.tagName === 'SELECT'){ ui.f[el.dataset.f] = el.value; if(el.id === 'sim-rol'){ const r = $('#sim-res'); if(r) r.innerHTML = simRes(el.value, $('#sim-fecha').value, $('#sim-hora').value); return; } return render(); }
  if(el.dataset.actChange === 'campoCorr'){ ui.modal.campo = el.value; ui.err = {}; return render(); }
  if(el.dataset.actChange === 'docPub'){ ui.modal.doc = el.value; ui.err = {}; return render(); }
});
window.addEventListener('hashchange', () => { ui.route = (location.hash||'').slice(1) || 'inicio'; ui.menu = false; render(); });

/* ---------- arranque ---------- */
if(S.session){
  if(Date.now() - S.session.ult > S.params.inactividadMin*6e4){ bit('Cierre por inactividad','Seguridad',`${S.params.inactividadMin} min sin actividad`, (me()||{}).usuario); S.session = null; ui.msg = {k:'info', t:'Su sesión se cerró por inactividad. Ingrese de nuevo.'}; save(); }
  else if(!me() || me().estado !== 'activo'){ S.session = null; save(); }
}
render();
getDl();
</script>
</body></html>
